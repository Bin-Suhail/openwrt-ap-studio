plugins { id 'com.android.application'; id 'com.chaquo.python' }

def releaseStore = providers.environmentVariable('APSTUDIO_KEYSTORE').orNull
android {
    namespace 'net.openwrt.apstudio'
    compileSdk 36
    defaultConfig {
        applicationId 'net.openwrt.apstudio'
        minSdk 24
        targetSdk 35
        versionCode 300
        versionName '3.0.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    signingConfigs {
        if (releaseStore != null) {
            publisher {
                storeFile file(releaseStore)
                storePassword providers.environmentVariable('APSTUDIO_STORE_PASSWORD').get()
                keyAlias providers.environmentVariable('APSTUDIO_KEY_ALIAS').getOrElse('apstudio')
                keyPassword providers.environmentVariable('APSTUDIO_KEY_PASSWORD').get()
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            if (releaseStore != null) signingConfig signingConfigs.publisher
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
chaquopy {
    defaultConfig {
        version '3.12'
        def configuredPython = providers.gradleProperty('apstudioPython').orNull
        if (configuredPython != null) buildPython configuredPython
    }
}
