name: Tests and Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/sync_android.py --check
  android:
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
      - run: python scripts/sync_android.py --check
      - run: sh gradlew --no-daemon assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: OpenWrt-AP-Studio-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          APK=$(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)
          test -n "$APK"
          cp "$APK" OpenWrt-AP-Studio.apk
          TAG="apk-${GITHUB_SHA}"
          gh release create "$TAG" OpenWrt-AP-Studio.apk \\
            --repo "$GITHUB_REPOSITORY" \\
            --target "$GITHUB_SHA" \\
            --title "OpenWrt AP Studio APK (${GITHUB_SHA:0:7})" \\
            --notes "Automatic Android debug APK built from commit $GITHUB_SHA. For testing only." \\
            --latest
